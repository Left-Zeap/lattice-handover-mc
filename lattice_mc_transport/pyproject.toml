[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-mc-transport"
version = "0.1.0"
description = "6D single-atom Monte Carlo simulator for L1 transport -> handover -> L2 transport."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]
ui = ["PySide6>=6.6"]

[project.scripts]
lattice-mc = "lattice_mc.cli:main"

[tool.setuptools.packages.find]
include = ["lattice_mc*"]

[tool.setuptools.package-data]
lattice_mc = ["data/*.json"]
